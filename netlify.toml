[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Las vistas previas (deploy previews y ramas) se publican en modo revisión: muestran borradores y no se indexan.
[context.deploy-preview.environment]
  PUBLIC_REVIEW = "true"
[context.branch-deploy.environment]
  PUBLIC_REVIEW = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---- Redirecciones del sitio WordPress anterior ----
[[redirects]]
  from = "/servicios"
  to = "/servicios/"
  status = 301
[[redirects]]
  from = "/contact-us/*"
  to = "/contacto/"
  status = 301
[[redirects]]
  from = "/contact/*"
  to = "/contacto/"
  status = 301
[[redirects]]
  from = "/about/*"
  to = "/nosotros/"
  status = 301
[[redirects]]
  from = "/portfolio/*"
  to = "/proyectos/"
  status = 301
[[redirects]]
  from = "/feed/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/comments/feed/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-content/uploads/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-login.php"
  to = "/"
  status = 301
[[redirects]]
  from = "/xmlrpc.php"
  to = "/"
  status = 410
[[redirects]]
  from = "/wp-json/*"
  to = "/"
  status = 410
[[redirects]]
  from = "/?p=*"
  to = "/"
  status = 301
