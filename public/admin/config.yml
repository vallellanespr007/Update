# Panel de contenido de Update Group (Decap CMS).
# Repositorio: vallellanespr007/Update (ver MIGRACION.md para activar el inicio de sesión con GitHub).
backend:
  name: github
  repo: vallellanespr007/Update
  branch: main

# Para editar en la computadora: `npm run cms` en una terminal y `npm run dev` en otra; luego abrir http://localhost:4321/admin/
local_backend: true

# Cada cambio se guarda como borrador y requiere publicación.
publish_mode: editorial_workflow
locale: es

media_folder: src/content/projects/media
public_folder: ./media

collections:
  - name: projects
    label: Proyectos
    label_singular: Proyecto
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    extension: md
    summary: "{{client}} — {{title}} {{draft}}"
    sortable_fields: [order, client, title]
    fields:
      - { name: title, label: Nombre del proyecto, widget: string }
      - { name: client, label: Cliente, widget: string }
      - name: sector
        label: Sector
        widget: select
        options:
          - { label: Marcas y empresas, value: marcas }
          - { label: Gobierno e instituciones, value: gobierno }
          - { label: Organizaciones y causas, value: organizaciones }
      - name: disciplines
        label: Disciplinas (filtros)
        widget: select
        multiple: true
        required: false
        options:
          - { label: Branding, value: branding }
          - { label: Redes sociales, value: redes-sociales }
          - { label: Audiovisual, value: audiovisual }
          - { label: Websites, value: websites }
          - { label: Campañas y eventos, value: campanas-eventos }
      - { name: summary, label: Resumen (1 oración), widget: text }
      - { name: cover, label: Imagen principal, widget: image, required: false }
      - { name: coverAlt, label: Texto alternativo de la imagen principal, widget: string, required: false, hint: "Describe lo que se ve en la imagen." }
      - { name: video, label: "Video (ruta en /media/, ej. /media/video.mp4)", widget: string, required: false }
      - { name: videoPoster, label: Imagen de portada del video, widget: image, required: false }
      - name: gallery
        label: Galería de entregables
        widget: list
        required: false
        fields:
          - { name: image, label: Imagen, widget: image }
          - { name: alt, label: Texto alternativo, widget: string }
      - { name: context, label: Contexto, widget: text, required: false }
      - { name: objective, label: Objetivo, widget: text, required: false }
      - { name: services, label: Servicios realizados (confirmados), widget: list, required: false }
      - { name: results, label: "Resultados (solo con datos aprobados)", widget: text, required: false }
      - { name: featured, label: Destacar en Inicio, widget: boolean, default: false }
      - { name: spotlight, label: "Caso destacado (sección grande en Inicio, solo uno)", widget: boolean, default: false }
      - { name: order, label: Orden, widget: number, default: 100, value_type: int }
      - { name: draft, label: "Borrador (no se publica)", widget: boolean, default: true }
      - { name: pending, label: Pendientes para publicar, widget: list, required: false }
      - { name: body, label: Texto adicional (opcional), widget: markdown, required: false }

  - name: services
    label: Servicios
    label_singular: Servicio
    folder: src/content/services
    create: true
    slug: "{{slug}}"
    extension: md
    sortable_fields: [order]
    fields:
      - { name: title, label: Nombre, widget: string }
      - { name: short, label: Nombre corto, widget: string }
      - { name: order, label: Orden, widget: number, value_type: int }
      - { name: summary, label: Descripción, widget: text }
      - { name: need, label: Qué necesidad atiende, widget: text }
      - { name: includes, label: Qué incluye, widget: list }

  - name: settings
    label: Configuración
    files:
      - name: clients
        label: Clientes
        file: src/content/clients.json
        fields:
          - name: clients
            label: Clientes
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: id, label: "Identificador (sin espacios)", widget: string }
              - { name: name, label: Nombre oficial, widget: string }
              - name: sector
                label: Sector
                widget: select
                options:
                  - { label: Marcas y empresas, value: marcas }
                  - { label: Gobierno e instituciones, value: gobierno }
                  - { label: Organizaciones y causas, value: organizaciones }
              - { name: abbr, label: "Siglas oficiales (opcional)", widget: string, required: false }
              - { name: logo, label: "Logo oficial (opcional)", widget: image, required: false, media_folder: /src/assets/clients, public_folder: ../assets/clients }
              - { name: home, label: Mostrar en Inicio, widget: boolean, default: false }
              - { name: order, label: Orden, widget: number, value_type: int, default: 100 }
      - name: site
        label: Datos del sitio
        file: src/data/site.json
        fields:
          - { name: name, label: Nombre, widget: string }
          - { name: legalName, label: Nombre legal, widget: string }
          - { name: founded, label: Año de fundación, widget: number, value_type: int }
          - { name: url, label: URL, widget: string }
          - { name: tagline, label: Concepto, widget: string }
          - { name: claim, label: Mensaje complementario, widget: string }
          - { name: location, label: Ubicación, widget: string }
          - { name: email, label: "Email público (dejar vacío hasta verificar)", widget: string, required: false }
          - { name: phone, label: "Teléfono público (no usar 787.123.4567)", widget: string, required: false }
          - name: social
            label: Redes sociales
            widget: object
            fields:
              - { name: instagram, label: Instagram, widget: object, fields: [{ name: handle, label: Usuario, widget: string }, { name: url, label: URL, widget: string }] }
              - { name: facebook, label: Facebook, widget: object, fields: [{ name: url, label: URL, widget: string, required: false }] }
              - { name: whatsapp, label: WhatsApp, widget: object, fields: [{ name: url, label: URL, widget: string, required: false }, { name: enabled, label: Mostrar, widget: boolean }] }
              - { name: linkedin, label: LinkedIn, widget: object, fields: [{ name: url, label: URL, widget: string, required: false }] }
          - { name: instagramFeedId, label: "ID del feed de Instagram (Behold.so)", widget: string, required: false }
          - name: analytics
            label: Analítica
            widget: object
            fields:
              - { name: ga4, label: "Google Analytics 4 (G-XXXXXXX)", widget: string, required: false }
              - { name: metaPixel, label: Meta Pixel ID, widget: string, required: false }
          - name: founder
            label: Mensaje del fundador (Nosotros)
            widget: object
            fields:
              - { name: approved, label: "Aprobado (si no, solo se ve en revisión)", widget: boolean, default: false }
              - { name: name, label: Nombre, widget: string }
              - { name: role, label: Cargo, widget: string }
              - { name: paragraphs, label: Párrafos, widget: list, field: { name: p, label: Párrafo, widget: text } }
          - name: stats
            label: "Cifras verificadas adicionales (Inicio)"
            widget: list
            required: false
            fields:
              - { name: value, label: "Cifra (ej. +120)", widget: string }
              - { name: label, label: Descripción, widget: string }
          - name: form
            label: Formulario
            widget: object
            fields:
              - { name: name, label: Nombre del formulario en Netlify, widget: string }
